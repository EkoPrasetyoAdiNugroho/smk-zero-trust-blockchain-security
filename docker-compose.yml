version: '3.8'

services:
  smk-cloudsec-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smk_zero_trust_blockchain_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
